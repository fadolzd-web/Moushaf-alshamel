name: build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: FIX FOLDERS
        run: |
          if [ -d "Www" ]; then mv Www www; fi
          if [ -d "WWW" ]; then mv WWW www; fi
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then cp index.html www/index.html; fi
          echo '{"appId":"com.mushaf.luxury","appName":"مصحفي","webDir":"www","plugins":{"LocalNotifications":{"smallIcon":"ic_launcher","iconColor":"#1A3C2A"}}}' > capacitor.config.json
          ls www/
      - run: npm install
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: FIX ICON - Use your ic_launcher.png
        run: |
          if [ -f "ic_launcher.png" ]; then
            echo "Installing custom icon..."
            # احذف الأيقونات المتضاربة اللي بتعمل Duplicate
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            # انسخ أيقونتك لكل المقاسات
            for size in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
              if [ -d "android/app/src/main/res/mipmap-$size" ]; then
                cp ic_launcher.png android/app/src/main/res/mipmap-$size/ic_launcher.png
                cp ic_launcher.png android/app/src/main/res/mipmap-$size/ic_launcher_round.png
                echo " -> mipmap-$size done"
              fi
            done
            ls android/app/src/main/res/mipmap-xxxhdpi/
          else
            echo "No ic_launcher.png in root, using default"
          fi
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks; fi
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then echo "storeFile=release-key.jks" > android/key.properties; echo "storePassword=$STORE_PASSWORD" >> android/key.properties; echo "keyAlias=$KEY_ALIAS" >> android/key.properties; echo "keyPassword=$KEY_PASSWORD" >> android/key.properties; fi
      - run: chmod +x android/gradlew
      - name: Build APK Debug (for testing with icon)
        run: cd android && ./gradlew assembleDebug
      - name: Build AAB + APK Release
        run: |
          cd android
          ./gradlew bundleRelease || true
          ./gradlew assembleRelease || true
      - name: Upload APK Debug - للتجربة مع الأيقونة
        uses: actions/upload-artifact@v4
        with:
          name: APK-مع-الايقونة-الجديدة
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB-للبلاي-ستور
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: APK-موقع-نهائي
          path: android/app/build/outputs/apk/release/app-release.apk
